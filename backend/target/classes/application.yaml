spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}  # Ajuste a URL para o PostgreSQL, ex: jdbc:postgresql://localhost:5432/seubanco
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update  # 'update', 'validate', 'create' ou 'none', conforme a sua estratégia
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration  # Certifique-se de que suas migrações são compatíveis com o PostgreSQL


cors:
  originPatterns: ${CORS_ALLOWED_ORIGINS}

security:
  jwt:
    token:
      secret-key: 53cr37
      expiration-length: 3600000

logging:
  level:
    org.springframework.security: DEBUG